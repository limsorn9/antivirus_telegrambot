name: Telegram Security Bot

on:
  workflow_dispatch: # អនុញ្ញាតឱ្យចុច Run ដោយផ្ទាល់ដៃ
  schedule:
    # ដំណើរការឡើងវិញរៀងរាល់ 5 ម៉ោងម្តង (មុនពេល GitHub Actions ដល់ Limit 6 ម៉ោង)
    - cron: '0 */5 * * *'
  push:
    branches:
      - main

concurrency:
  group: telegram-security-bot-instance
  cancel-in-progress: true

jobs:
  run-bot:
    name: Run Telegram Security Bot
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Security Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          SUPER_ADMIN_ID: ${{ secrets.SUPER_ADMIN_ID }}
          PUNISHMENT_MODE: ${{ secrets.PUNISHMENT_MODE || 'MUTE' }}
          MUTE_DURATION_HOURS: ${{ secrets.MUTE_DURATION_HOURS || '24' }}
          AUTO_DELETE_SERVICE_MSGS: "true"
          BOT_MSG_DELETE_SECONDS: "60"
          ANTI_FLOOD_ENABLED: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          python telegram_security_bot.py
